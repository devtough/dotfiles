# =============================================================================
# whichkey: the board appears when your fingers miss.
#
# The prefix stays the real chord mechanism -- known chords (C-a c, C-a j, ..)
# run the prefix binds in tmux.conf at native speed and never see any of
# this. `Any` below catches every key that is NOT bound after C-a and opens
# scripts/wk-menu.sh in a popup: a three-column whichkey grid of every
# binding. C-a is itself unbound in the prefix table, so Any catches it too:
# C-a C-a = show me the board, on demand.
#
# The grid executes nothing itself. It reads one key, closes, and replays
# `C-a <key>` at the client (send-keys -K), so the real bind runs with full
# context -- the script carries keys and labels only and cannot drift in
# behavior, only in coverage. It also forgives ctrl-held chording (C-c on the
# board acts as c; C-p/C-v/C-s stay themselves -- they are real binds).
#
# History, for whoever considers "just make C-a open the board directly":
# v1 did exactly that (prefix None + root-table C-a -> menu). Measured on
# tmux 3.7b with a nested-server rig: bindings dispatch through the command
# queue, so a fast C-a c races the overlay install -- 26/26 on an idle
# machine, 0/5 under load. Only the prefix mechanism arms synchronously in
# the key dispatcher. Don't revive v1.
# =============================================================================

# Night Owl chrome for tmux's stock menus (right-click menus; tmux >= 3.4)
set -g menu-style "bg=#011627,fg=#d6deeb"
set -g menu-selected-style "bg=#1d3b53,fg=#82aaff,bold"
set -g menu-border-style "bg=#011627,fg=#82aaff"
set -g menu-border-lines rounded

# Migration hygiene: clear the v1 menu-as-prefix binds if a live server still
# carries them. No-ops on a fresh server.
unbind -n C-a
unbind -T copy-mode-vi C-a

bind -T prefix Any display-popup -E -w 76 -h 16 -b rounded \
    -S "fg=#82aaff" -s "bg=#011627,fg=#d6deeb" \
    -T "#[fg=#82aaff,bold] C-a " \
    "~/.config/tmux/scripts/wk-menu.sh '#{client_name}'"
