# =============================================================================
# whichkey: the menu appears when your fingers miss.
#
# v1 of this prototype retired the prefix and made C-a open a display-menu of
# every binding (menu-as-prefix, always visible). Measured verdict: unfixably
# racy. Key bindings dispatch through the command queue, so under load a fast
# `C-a c` lands the c before the menu overlay is installed and the chord is
# lost -- reproduced 0/5 on a loaded machine, 26/26 on an idle one, which is
# exactly the "inconsistent" it felt like. The prefix mechanism is the one
# two-key chord tmux arms synchronously in the key dispatcher itself, so the
# prefix is back and the menu rides on top of it:
#
#   - known chords (C-a c, C-a j, ...) run the real prefix binds in tmux.conf
#     at native speed -- no menu, no flicker, no race.
#   - `Any` in the prefix table catches every key that is NOT bound and opens
#     the menu instead of silently dropping the key: mistype and the board
#     appears with your options.
#   - C-a is itself unbound in the prefix table, so Any catches it too:
#     C-a C-a = show me everything, on demand. C-a again (or Esc/q) closes.
#
# The menu items duplicate the real binds' commands by hand until a generator
# emits both from one source -- keep them in sync with tmux.conf.
#
# The #[dim] rows are ctrl-held aliases: chording fast often lands the second
# key while ctrl is still down, and inside the menu C-c would otherwise be
# ignored. The dim duplicates make the sloppy variant work. C-p and C-v have
# no aliases; those keys are taken (claude scratch, copy mode).
# =============================================================================

# Night Owl menu chrome (menu-style options need tmux >= 3.4)
set -g menu-style "bg=#011627,fg=#d6deeb"
set -g menu-selected-style "bg=#1d3b53,fg=#82aaff,bold"
set -g menu-border-style "bg=#011627,fg=#82aaff"
set -g menu-border-lines rounded

# Migration hygiene: clear the v1 menu-as-prefix binds if a live server still
# carries them. No-ops on a fresh server.
unbind -n C-a
unbind -T copy-mode-vi C-a

bind -T prefix Any display-menu -T "#[fg=#82aaff,bold] C-a " -x C -y C -- \
    "-#[nodim,fg=#c5e478]panes" "" "" \
    "split below"     "-"   { split-window -v -c "#{pane_current_path}" } \
    "split right"     "|"   { split-window -h -c "#{pane_current_path}" } \
    "claude below"    "_"   { split-window -v -c "#{pane_current_path}" "claude --dangerously-skip-permissions --chrome" } \
    "claude right"    '\'   { split-window -h -c "#{pane_current_path}" "claude --dangerously-skip-permissions --chrome" } \
    "zoom"            "z"   { resize-pane -Z } \
    "kill pane"       "x"   { confirm-before -p "kill-pane #P? (y/n)" kill-pane } \
    "copy mode"       "C-v" { copy-mode } \
    "copy cwd"        "y"   { run-shell "tmux display-message -p '#{pane_current_path}' | pbcopy && tmux display-message 'Copied: #{pane_current_path}'" } \
    "" \
    "-#[nodim,fg=#c5e478]windows" "" "" \
    "new window"      "c"   { new-window -c "#{pane_current_path}" } \
    "#[dim]new window"  "C-c" { new-window -c "#{pane_current_path}" } \
    "last window"     "l"   { last-window } \
    "#[dim]last window" "C-l" { last-window } \
    "next window"     "n"   { next-window } \
    "#[dim]next window" "C-n" { next-window } \
    "prev window"     "p"   { previous-window } \
    "jump (fzf)"      "j"   { if-shell -F "#{@popup_open}" { display-message "a popup is already open" } { set -g @popup_open 1 ; display-popup -E -w 70% -h 70% "tmux list-windows -a -F '#{session_name}:#{window_index}  #{window_name}  [#{pane_current_command}]' | fzf --reverse --no-sort --preview '~/.config/tmux/scripts/peek-preview.sh {1}' --preview-window=down:60%,follow | awk '{print \$1}' | xargs -r tmux switch-client -t ; tmux set -g @popup_open 0" } } \
    "peek (fzf)"      "P"   { if-shell -F "#{@popup_open}" { display-message "a popup is already open" } { set -g @popup_open 1 ; display-popup -w 85% -h 85% -E 'target=$(tmux list-windows -a -F "#{session_name}:#{window_index}  #{window_name}  [#{pane_current_command}]" | fzf --reverse --no-sort --preview "~/.config/tmux/scripts/peek-preview.sh {1}" --preview-window=down:60%,follow | awk "{print \$1}"); if [ -n "$target" ]; then sess="${target%%:*}"; orig=$(tmux display-message -p -t "$sess" "#{window_index}"); tmux select-window -t "$target"; TMUX= tmux attach -f ignore-size -t "$sess"; tmux select-window -t "$sess:$orig"; fi; tmux set -g @popup_open 0' } } \
    "tree"            "w"   { choose-tree -Zw -F "#{?pane_format,#{?pane_marked,#[reverse],}#{?#{m:✳*,#{pane_title}},#{s/^✳ //:pane_title},#{pane_current_command}}#{?pane_active,*,}#{?pane_marked,#[default],},#{?window_format,#{window_name}#{window_flags},#{session_name}: #{session_windows} windows}}" } \
    "rename"          ","   { command-prompt -I "#W" "rename-window -- '%%'" } \
    "AI-name window"  "N"   { display-message "naming window..." ; run-shell -b "~/.local/bin/tmux-name window '#{session_name}:#{window_index}'" } \
    "AI-name session" "S"   { display-message "naming session..." ; run-shell -b "~/.local/bin/tmux-name session '#{session_name}'" } \
    "" \
    "-#[nodim,fg=#c5e478]sessions & agents" "" "" \
    "agents (corral)" "a"   { if-shell -F "#{@popup_open}" { display-message "a popup is already open" } { set -g @popup_open 1 ; display-popup -E -w 80% -h 70% "~/.config/tmux/scripts/corral-picker.sh ; tmux set -g @popup_open 0" } } \
    "claude scratch"  "C-p" { if-shell -F "#{==:#{session_name},claude}" { detach-client } { if-shell -F "#{@popup_open}" { display-message "a popup is already open" } { set -g @popup_open 1 ; display-popup -w 85% -h 85% -E "tmux new-session -d -s claude 2>/dev/null; tmux set-option -t claude detach-on-destroy on; TMUX= tmux attach -t claude; tmux set -g @popup_open 0" } } } \
    "detach"          "d"   { detach-client } \
    "#[dim]detach"      "C-d" { detach-client } \
    "save layout"     "C-s" { run-shell "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh" } \
    "command prompt"  ":"   { command-prompt } \
    "close"           "C-a" { }
